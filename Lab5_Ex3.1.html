<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lợi ích của công nghệ số trong học tập</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f7ff;
      color: #07326f;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      text-align: center;
      color: #063274;
      margin-bottom: 28px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 16px #164b8425;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 10px;
    }

    h2 {
      color: #0875d1;
      margin-top: 0;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      color: #555;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Lợi ích của công nghệ số trong học tập</h1>

    <section class="content">
      <article class="card">
        <h2>Infographic</h2>
        <img
          src="Lab05_Ex2.1.png"
          alt="Infographic về lợi ích của công nghệ số trong học tập"
        >
      </article>

      <article class="card">
        <h2>Video YouTube</h2>
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/B8Qu6sqpp60?autoplay=1&mute=1&rel=0"
            title="Lợi ích công nghệ số"
            allow="autoplay; encrypted-media; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </article>
    </section>

    <footer>
      Học mọi lúc, kết nối mọi nơi, phát triển theo cách của bạn
      <br>
      Tất cả hình ảnh được lấy từ pexels.com và video được thực hiện bằng Canva AI.
    </footer>

  </main>
</body>
</html>
